name: TrackWerk software checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android developer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Locate the application source
        id: app_source
        run: |
          if test -f source/gradlew; then echo "directory=source" >> "$GITHUB_OUTPUT"; else echo "directory=." >> "$GITHUB_OUTPUT"; fi
      - name: Install documented Android build dependencies
        run: sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build developer APK and software tests
        working-directory: ${{ steps.app_source.outputs.directory }}
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=3
      - name: Check binary ABI and license payload
        working-directory: ${{ steps.app_source.outputs.directory }}
        run: python3 tools/release/check_apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-developer-build-not-public-release
          path: ${{ steps.app_source.outputs.directory }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  native:
    name: Native development and launcher checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Locate the application source
        id: app_source
        run: |
          if test -f source/gradlew; then echo "directory=source" >> "$GITHUB_OUTPUT"; else echo "directory=." >> "$GITHUB_OUTPUT"; fi
      - name: Install SDL development dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev
      - name: Build shared native engine and checks
        working-directory: ${{ steps.app_source.outputs.directory }}
        run: |
          cmake -S shell -B build/host -DCMAKE_BUILD_TYPE=Release -DPT_STUDIO_CHECK=ON
          cmake --build build/host -j3
      - name: Verify independent Brick launcher
        working-directory: ${{ steps.app_source.outputs.directory }}
        run: python3 tests/brick-launcher/check_launcher.py
      - name: Run the complete host check manifest
        working-directory: ${{ steps.app_source.outputs.directory }}
        run: python3 ../release-tools/run_host_checks.py --source . --build build/host/native --output "$RUNNER_TEMP/trackwerk-host-checks"
      - name: Verify data-preserving updater and portable preparation
        working-directory: ${{ steps.app_source.outputs.directory }}
        run: |
          python3 tests/brick-launcher/check_program_updater.py
          python3 tests/brick-launcher/check_preset_preparer.py
          python3 tests/brick-launcher/check_preset_library.py
          python3 tests/r36s-launcher/check_launcher.py

  windows:
    name: Windows build and damaged-file checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Locate the application source
        id: app_source
        shell: bash
        run: |
          if test -f source/gradlew; then echo "directory=source" >> "$GITHUB_OUTPUT"; else echo "directory=." >> "$GITHUB_OUTPUT"; fi
      - name: Build the app and the portable checks with MSVC
        working-directory: ${{ steps.app_source.outputs.directory }}
        run: |
          cmake -S shell -B build/windows -A x64 -DPT_SAFETY_CHECK=ON   # the runner's own Visual Studio
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/windows --config Release -- /m
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Damaged files are refused; LOAD and SAVE ask first
        working-directory: ${{ steps.app_source.outputs.directory }}
        run: |
          build/windows/native/Release/ptcorrupt-files-check.exe tests/corrupt-files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptload-save-prompts-check.exe "$env:RUNNER_TEMP/ptload-save-prompts-check"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptsave-safety-check.exe "$env:RUNNER_TEMP/ptsave-safety-check"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptlatency-row-check.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptvisualizer-check.exe "$env:RUNNER_TEMP/ptvisualizer-check"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptsharp-scaling-check.exe "$env:RUNNER_TEMP/ptsharp-scaling-check"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptwide-mode-check.exe "$env:RUNNER_TEMP/ptwide-mode-check"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptfake-stereo-check.exe "$env:RUNNER_TEMP/ptfake-stereo-check"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptdrumlab-manual-check.exe "$env:RUNNER_TEMP/ptdrumlab-manual-check"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptmaster-limiter-check.exe "$env:RUNNER_TEMP/ptmaster-limiter-check"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptsample-interp-check.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptoversampled-drive-check.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/Release/ptsdl-capture-check.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/pthelp-units-check.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptkey-bar-check.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/windows/native/Release/ptfile-validation-check.exe "$env:RUNNER_TEMP/ptfile-validation-check"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
