name: Publish verified TrackWerk website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trackwerk-website
  cancel-in-progress: false
jobs:
  website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify current public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.3.0 --repo kidbee85-beep/TrackWerk --json isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PYTHON'
          import json,sys
          from pathlib import Path
          release=json.loads(Path(sys.argv[1]).read_text())
          assert not release['isDraft'] and not release['isPrerelease']
          public=json.loads(Path('PUBLICATION-MANIFEST.json').read_text())
          actual={x['name']:x for x in release['assets']}
          for name,item in public['assets'].items():
              assert actual[name]['size']==item['bytes'],name
              if actual[name].get('digest'):assert actual[name]['digest']=='sha256:'+item['sha256'],name
          assert Path('docs/site/assets/guide/TrackWerk-1.3-Manual-EN.pdf').is_file()
          assert Path('docs/site/assets/video/trackwerk-1.3-update.mp4').is_file()
          PYTHON
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/site
      - name: Deploy current website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
